name: Build APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: "on-failure"

      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble${{ inputs.variant }} -Darch=${{ matrix.arch }}

      - name: Locate generated APK
        id: find_apk
        shell: bash
        run: |
          set -euo pipefail

          variant_lower=$(echo "${{ inputs.variant }}" | tr '[:upper:]' '[:lower:]')
          output_dir="ZalithLauncher/build/outputs/apk/${variant_lower}"

          if [ ! -d "$output_dir" ]; then
            echo "Expected output directory not found: $output_dir" >&2
            exit 1
          fi

          mapfile -t apk_files < <(find "$output_dir" -maxdepth 1 -name "*.apk" -type f | sort)

          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No APK files found in $output_dir" >&2
            exit 1
          fi

          if [ "${#apk_files[@]}" -gt 1 ]; then
            echo "Expected exactly one APK per matrix job (arch=${{ matrix.arch }}), found ${#apk_files[@]}:" >&2
            printf '  %s\n' "${apk_files[@]}" >&2
            exit 1
          fi

          apk_path="${apk_files[0]}"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$apk_path")" >> "$GITHUB_OUTPUT"

      - name: Upload APK as its own artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.find_apk.outputs.apk_name }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          compression-level: 0
          if-no-files-found: error
